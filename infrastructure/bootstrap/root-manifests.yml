apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/WillyTheDev/home-kube.git'
    targetRevision: HEAD
    path: infrastructure/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true